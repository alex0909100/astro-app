<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Astro App · Admin</title><link rel="stylesheet" href="/admin.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="admin-shell">
    <header><div><span class="eyebrow">ASTRO APP</span><h1>Административная панель</h1></div><button id="refresh">Обновить</button></header>
    <section id="status" class="notice">Проверка доступа…</section>
    <section class="metrics"><article><small>ПОЛЬЗОВАТЕЛИ</small><strong id="total">—</strong></article><article><small>АКТИВНЫЕ · 7 ДНЕЙ</small><strong id="active">—</strong></article><article><small>VIP</small><strong id="vip">—</strong></article></section>
    <section class="panel"><h2>Регистрации по дням</h2><div id="registrations" class="bars"></div></section>
    <section class="panel"><div class="panel-head"><h2>Пользователи</h2><input id="search" placeholder="ID или username"></div><div class="table-wrap"><table><thead><tr><th>Пользователь</th><th>Регистрация</th><th>VIP</th><th>Действия</th></tr></thead><tbody id="users"></tbody></table></div></section>
    <section class="panel"><h2>Обратная связь</h2><div id="feedback"></div><form id="reply-form"><input id="reply-user" placeholder="Telegram ID пользователя" required><textarea id="reply-text" placeholder="Ответ пользователю" required></textarea><button>Ответить через бота</button></form></section>
    <section class="panel"><h2>Администраторы</h2><p class="muted">Добавьте числовой Telegram ID. Основной администратор из переменной окружения защищён от удаления.</p><form id="admin-form"><input id="admin-id" inputmode="numeric" placeholder="Telegram ID нового администратора" required><button>Добавить администратора</button></form><div id="admins"></div></section>
  </main><script src="/admin.js"></script>
</body></html>
